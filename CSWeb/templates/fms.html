<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorite Movies Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f3f0ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .movie-form-wrap {
      max-width: 560px;
      width: 100%;
      background: #fff;
      border: 1px solid #e0ddd5;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .movie-header {
      background: #0F1923;
      padding: 2rem 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .movie-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 40px
      );
    }

    .movie-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: #F5E6C8;
      margin: 0 0 4px;
      letter-spacing: 0.5px;
      position: relative;
    }

    .movie-header p {
      font-size: 13px;
      color: rgba(245,230,200,0.5);
      margin: 0;
      position: relative;
    }

    .clapperboard {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      font-size: 36px;
      opacity: 0.7;
    }

    .form-body {
      padding: 1.75rem 2rem 2rem;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #888;
      margin: 0 0 10px;
    }

    .section {
      margin-bottom: 1.75rem;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid #e0ddd5;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: #fff;
    }

    .radio-option:hover {
      border-color: #bbb;
      background: #faf9f6;
    }

    .radio-option input[type="radio"] {
      accent-color: #C8973A;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .radio-option input[type="radio"]:checked + .radio-icon + span,
    .radio-option input[type="radio"]:checked + span {
      font-weight: 500;
      color: #1a1a1a;
    }

    .radio-option:has(input:checked) {
      border-color: #C8973A;
      background: rgba(200, 151, 58, 0.06);
    }

    .radio-option span {
      font-size: 14px;
      color: #555;
    }

    .radio-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      opacity: 0.85;
    }

    .text-field-wrap input[type="text"] {
      width: 100%;
      border: 1px solid #e0ddd5;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .text-field-wrap input[type="text"]:focus {
      border-color: #C8973A;
      box-shadow: 0 0 0 3px rgba(200,151,58,0.12);
    }

    .text-field-wrap input[type="text"]::placeholder {
      color: #bbb;
    }

    .divider {
      height: 1px;
      background: #e0ddd5;
      margin: 1.5rem 0;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #0F1923;
      color: #F5E6C8;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .submit-btn:hover { opacity: 0.88; }
    .submit-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="movie-form-wrap">
    <div class="movie-header">
      <span class="clapperboard" aria-hidden="true">🎬</span>
      <h1>Favorite Movies</h1>
      <p>Tell us about your cinema taste</p>
    </div>

    <form class="form-body" action="/collect_favorites" method="get">

      <div class="section">
        <p class="section-label">Favorite type of movie</p>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="fav_type" value="Comedy">
            <span class="radio-icon" aria-hidden="true">😄</span>
            <span>Comedies</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="fav_type" value="Horror">
            <span class="radio-icon" aria-hidden="true">👻</span>
            <span>Horror</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="fav_type" value="Action">
            <span class="radio-icon" aria-hidden="true">💥</span>
            <span>Action</span>
          </label>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section">
        <p class="section-label">Movies watched per year</p>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="num_of_movies" value="0">
            <span>0</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="num_of_movies" value="5">
            <span>1 – 5</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="num_of_movies" value="10">
            <span>5 – 10</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="num_of_movies" value="10+">
            <span>10+</span>
          </label>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section" style="margin-bottom: 1.5rem;">
        <p class="section-label">Favorite movie of all time</p>
        <div class="text-field-wrap">
          <input type="text" id="fav_movie" name="fav_movie" placeholder="e.g. The Godfather, Parasite…">
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit</button>

    </form>
  </div>

</body>
</html>
